name: Execution
on:
  schedule:
    - cron: "0 0 15 * *"
  workflow_dispatch:

permissions:
  contents: write
jobs:
  download-bigquery-agg:
    runs-on: ubuntu-26.04
    steps:
      - id: "checkout"
        uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1
      - id: "auth"
        uses: 'google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093' # v3.0.0
        with:
          credentials_json: '${{ secrets.GOOGLE_CREDENTIALS }}'
      - id: "java_setup"
        uses: "actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880" # v6.3.0
        with:
          distribution: 'temurin'
          java-version: '21'
      - id: "gradle"
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - id: "run"
        name: "Build and Run"
        run: "./gradlew run"
      - id: "get_filename"
        name: "Get the generated filename and create tag name"
        run: |
          FILENAME=$(ls | grep -E '[0-9]{6}\.csv\.xz$')
          TAG_NAME=$(basename "$FILENAME" .csv.xz)
          echo "FILENAME=$FILENAME" >> $GITHUB_ENV
          echo "TAG_NAME=$TAG_NAME" >> $GITHUB_ENV
      - id: "generate_tag"
        name: "Generate a new tag"
        run: |
          git tag "$TAG_NAME"
          git push --force origin "$TAG_NAME"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - id: "release_csv"
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          body: ${{ env.FILENAME }}
          tag_name: ${{ env.TAG_NAME }}
          files: ${{ env.FILENAME }}
